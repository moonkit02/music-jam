name = "music-jam"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Static client is served from public/; any path with no matching asset (e.g. /ws)
# falls through to the Worker.
assets = { directory = "public" }

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Single global registry of public rooms, so the landing page can list them.
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# SQLite-backed Durable Objects work on the free Workers plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]
